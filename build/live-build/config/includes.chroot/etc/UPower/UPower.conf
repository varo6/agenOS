# AgenOS laptop power policy. Keep this compatible with UPower 0.99.20 in
# Debian 12; this release does not support configuration drop-ins.
[UPower]
EnableWattsUpPro=false
NoPollBatteries=false
IgnoreLid=false

# Percentage-based thresholds are more predictable than firmware-provided
# remaining-time estimates under sudden load.
UsePercentageForPolicy=true
PercentageLow=20
PercentageCritical=7
PercentageAction=3
TimeLow=1200
TimeCritical=420
TimeAction=180

# A live system cannot assume that hibernation or persistent swap exists.
CriticalPowerAction=PowerOff
