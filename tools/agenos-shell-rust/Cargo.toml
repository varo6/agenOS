[package]
name = "agenos-shell-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.27", features = ["user"] }
rust-ini = "0.20"
shlex = "1.3"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "helper"
path = "src/bin/helper.rs"

[[bin]]
name = "emergency"
path = "src/bin/emergency.rs"
